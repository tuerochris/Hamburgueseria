<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caja · La Hamburguesería</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#171010;--card:#271b16;--c2:#34251e;--ink:#fff3dc;--mut:#c2aa9a;--line:#48352b;--amb:#f4b52e;--red:#ee5238;--grn:#86c94a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:800 16px/1.3 Nunito,system-ui,sans-serif;padding-bottom:90px;max-width:760px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hd{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.br{flex:1;line-height:1.1}.br b{font:400 22px 'Alfa Slab One',Georgia,serif;display:block}.br small{color:var(--mut);font-weight:700}
.clk{font:400 24px 'Alfa Slab One',Georgia,serif;color:var(--amb);white-space:nowrap}
.warn{margin:8px 14px;background:#6a1f14;border-radius:14px;padding:12px}
.sum{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;padding:6px 14px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.sum div{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--amb);border-radius:16px;padding:8px 12px}
.sum b{font:400 30px/1 'Alfa Slab One',Georgia,serif;display:block}.sum small{color:var(--mut);font-size:12px}
#list{padding:6px 14px}
.o{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--amb);border-radius:18px;padding:12px;margin-bottom:12px;animation:in .35s ease}
.o.yp{border-left-color:#9b3bb5}.o.old{opacity:.6}
@keyframes in{from{opacity:0;transform:translateY(-10px)}}
.oh{display:flex;align-items:center;gap:10px}
.num{font:400 34px/1 'Alfa Slab One',Georgia,serif}.qty{font:400 18px 'Alfa Slab One',Georgia,serif;color:var(--amb);margin-left:6px}
.who{flex:1;min-width:0}.who b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who small{color:var(--mut);font-weight:700}
.amt{font:400 24px 'Alfa Slab One',Georgia,serif;color:var(--amb)}
ul{list-style:none;padding:0;margin:10px 0 0;color:var(--mut);font-weight:700}li{padding:3px 0}li b{color:var(--ink)}
.bd{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.bd span{background:var(--c2);border-radius:10px;padding:4px 10px;font-size:13px}
.bd .pur{background:#5b1a72;color:#f6dcff}.bd .cash{background:#e8d8b4;color:#3b2a14}.bd .hot{background:#7a2fa0;color:#fff;animation:blink 1.2s infinite}.bd .late{background:#6a1f14}.bd .gift{background:#d62f1b}
@keyframes blink{50%{opacity:.6}}
.act{display:flex;gap:8px;margin-top:12px}
.b{border-radius:14px;padding:14px;min-height:54px;font-size:18px}
.main{flex:1;background:var(--amb);color:#1b1006}.gf{background:#d62f1b;color:#fff}.sec{background:var(--c2);color:var(--mut);width:54px}
.empty{color:var(--mut);text-align:center;padding:30px 10px;border:2px dashed var(--line);border-radius:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#fff3dc;color:#2a1a05;border-radius:16px;padding:12px 16px;z-index:40;max-width:92vw;box-shadow:0 8px 24px #000a}
[hidden]{display:none!important}
</style></head>
<body>
<header class="hd"><div class="br"><b>💵 Caja</b><small>La Hamburguesería</small></div><div class="clk" id="clk"></div></header>
<p class="warn" id="warn" hidden>Falta conectar la base de datos: abre config.js y pega tu URL y tu clave de Supabase.</p>
<div class="sum" id="sum"></div>
<main id="list"></main>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1"></script>
<script src="db.js"></script>
<script>
const $=q=>document.querySelector(q),esc=x=>String(x).replace(/[<>&"]/g,''),money=n=>'S/ '+Number(n).toFixed(2);
const NM={queso:'Queso',lechuga:'Lechuga',huevo:'Huevo frito',salchicha:'Salchicha',papas:'Papas al hilo'},CR={tartara:'Tártara',ketchup:'Ketchup',mostaza:'Mostaza',mayo:'Mayonesa',aji:'Ají'};
let O=[],C={},tT;
const desc=b=>{const e=Object.keys(NM).filter(k=>b[k]).map(k=>NM[k]),c=Object.keys(CR).filter(k=>b[k]).map(k=>CR[k]);return (e.length?e.join(', '):'Solo pan y carne')+' · '+(c.length?'Cremas: '+c.join(', '):'Sin cremas')};
function toast(m){clearTimeout(tT);const t=$('#toast');t.textContent=m;t.hidden=false;tT=setTimeout(()=>t.hidden=true,4500)}
async function loadC(code){if(code&&!(code in C))C[code]=await DB.customer(code).catch(()=>null);return C[code]}
function card(o){const age=(Date.now()-Date.parse(o.created_at))/6e4,c=C[o.code],old=age>15,yp=o.pm=='yape',gift=c&&c.stamps>=10;
 return `<article class="o${yp?' yp':''}${old?' old':''}"><div class="oh"><div class="num">#${o.n}<span class="qty">(${o.burgers.length})</span></div><div class="who"><b>${esc(o.name)}</b><small>${o.code?'🎟️ '+o.code+(c?` · ${c.stamps}/10 sellos`:''):'Sin registro'}</small></div><div class="amt">${money(o.total)}</div></div>
 <ul>${o.burgers.map((b,i)=>`<li><b>${i+1}.</b> ${desc(b)}</li>`).join('')}</ul>
 <div class="bd"><span class="${yp?'pur':'cash'}">${yp?'💜 Yape':'💵 Caja'}</span>${o.st=='yape'?'<span class="hot">Dice que ya yapeó</span>':''}${old?'<span class="late">⏰ Venció (más de 15 min)</span>':''}${gift?'<span class="gift">🎁 Tiene 10 sellos: premio</span>':''}</div>
 <div class="act"><button class="b main" data-a="paid" data-id="${o.id}">${yp?'💜 Confirmar Yape':'✅ Marcar pagado'}</button>${gift?`<button class="b gf" data-a="redeem" data-id="${o.id}">🎁 Canjear</button>`:''}<button class="b sec" data-a="cancel" data-id="${o.id}" aria-label="Cancelar pedido ${o.n}">✕</button></div></article>`}
function render(){
 const L=O.filter(o=>o.st=='pay'||o.st=='yape').sort((a,b)=>Date.parse(a.created_at)-Date.parse(b.created_at));
 $('#sum').innerHTML=`<div><b>${L.length}</b><small>Por cobrar</small></div><div><b>${money(L.reduce((a,o)=>a+Number(o.total),0))}</b><small>Total pendiente</small></div>`;
 $('#list').innerHTML=L.length?L.map(card).join(''):'<p class="empty">No hay pedidos por cobrar 🎉</p>'}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const o=O.find(x=>x.id==b.dataset.id);if(!o)return;
 try{
  if(b.dataset.a=='paid'){await DB.setOrder(o.id,{st:'pend'});o.st='pend';let m=`#${o.n} pagado · pasa a cocina`;
   if(o.code){const c=await DB.addStamp(o.code);if(c){C[o.code]=c;m+=` · sello ${c.stamps}/10`}}toast(m)}
  else if(b.dataset.a=='cancel'){await DB.setOrder(o.id,{st:'cancel'});o.st='cancel';toast(`#${o.n} cancelado`)}
  else if(b.dataset.a=='redeem'){C[o.code]=await DB.setStamps(o.code,0);toast('Premio canjeado: descuenta 1 hamburguesa. El cliente vuelve a 0 sellos')}
 }catch(err){console.error(err);toast('No se pudo guardar. Revisa la conexión.')}
 render()});
function upsert(r){delete C[r.code];const i=O.findIndex(x=>x.id==r.id);if(i<0){O.push(r);if(r.st=='pay'){toast(`Nuevo pedido #${r.n} de ${esc(r.name)}`);try{navigator.vibrate&&navigator.vibrate(200)}catch(x){}}}else O[i]=r;
 render();if(r.code)loadC(r.code).then(render)}
if(!DB.ok)$('#warn').hidden=false;
else{DB.orders(['pay','yape']).then(rs=>{O=rs;render();rs.forEach(o=>o.code&&loadC(o.code).then(render))}).catch(e=>{console.error(e);toast('No se pudo conectar con la base de datos')});DB.watch(upsert)}
render();
const clk=()=>$('#clk').textContent=new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false});clk();setInterval(()=>{clk();render()},30000);
</script>
</body></html>
