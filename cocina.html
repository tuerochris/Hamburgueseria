<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cocina · La Hamburguesería</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#171010;--card:#271b16;--c2:#34251e;--ink:#fff3dc;--mut:#c2aa9a;--line:#48352b;--amb:#f4b52e;--red:#ee5238;--grn:#86c94a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{background:var(--bg);color:var(--ink);font:800 16px/1.3 Nunito,system-ui,sans-serif;padding-bottom:90px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hd{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 10px;padding:12px 14px 6px}
.br{flex:1;min-width:0;line-height:1.1}.br b{font:400 20px 'Alfa Slab One',Georgia,serif;display:block}.br small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-weight:700}
.clk{font:400 24px 'Alfa Slab One',Georgia,serif;color:var(--amb);white-space:nowrap}
.tools{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tools button{background:var(--c2);border-radius:12px;padding:8px;font-size:14px;min-height:42px}
.tools button[aria-pressed=true]{background:var(--amb);color:#2a1a05}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:19;background:var(--bg);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 14px}
.tabs button{background:var(--c2);border-radius:14px;padding:11px 2px;font-size:14px;white-space:nowrap;border-bottom:4px solid var(--stc)}
.tabs button.on{background:var(--stc);color:#1b1006}
.tabs em{font-style:normal;background:#0004;border-radius:99px;padding:1px 7px;margin-left:3px}
.stats{display:flex;gap:14px;flex-wrap:wrap;padding:6px 16px 10px;color:var(--mut);font-size:14px}.stats b{color:var(--ink)}
.t-pend,#c-pend{--stc:var(--amb)}.t-cook,#c-cook{--stc:var(--red)}.t-ready,#c-ready{--stc:var(--grn)}
.cols{padding:0 14px}
.col{display:none}.col.on{display:block}
.ch{display:none;align-items:center;justify-content:space-between;font:400 19px 'Alfa Slab One',Georgia,serif;padding:8px 4px;border-bottom:4px solid var(--stc);margin-bottom:12px}
.ch span{background:var(--stc);color:#1b1006;border-radius:99px;padding:0 12px}
@media (min-width:860px){.tabs{display:none}.sum{padding-top:12px}.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}.col{display:block}.ch{display:flex;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}.hd{grid-template-columns:1fr auto auto}.tools{grid-column:auto;display:flex}}
.o{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--stc);border-radius:18px;padding:12px;margin-bottom:12px;animation:in .35s ease}
.o.new{animation:in .35s ease,glow 2.4s ease}
@keyframes in{from{opacity:0;transform:translateY(-12px)}}
@keyframes glow{0%,60%{box-shadow:0 0 0 4px var(--stc),0 0 26px var(--stc)}100%{box-shadow:none}}
.st-pend{--stc:var(--amb)}.st-cook{--stc:var(--red)}.st-ready{--stc:var(--grn)}
.oh{display:flex;align-items:center;gap:10px}
.num{font:400 36px/1 'Alfa Slab One',Georgia,serif}
.who{flex:1;min-width:0}.who b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who small{color:var(--mut);font-weight:700}
.tm{font:400 18px 'Alfa Slab One',Georgia,serif;padding:6px 10px;border-radius:12px;background:#2c4a1a;color:#c8f08e}
.tm.warn{background:#5a4210;color:#ffd36b}.tm.bad{background:#7a2216;color:#ffc4b8;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.body{display:flex;gap:12px;margin-top:10px;align-items:center}
.stk{position:relative;width:112px;flex:none;aspect-ratio:460/520;background:radial-gradient(ellipse at 50% 85%,#4a3226,#0000 70%)}
.stk i{position:absolute;display:block;background-size:100% 100%;background-repeat:no-repeat}
.ing{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.gl{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.chs{display:flex;flex-wrap:wrap;gap:5px}
.cp{display:inline-flex;align-items:center;gap:6px;background:var(--c2);border-radius:99px;padding:3px 11px 3px 3px;font-size:14px}
.th{width:26px;height:26px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#4b372d;flex:none}
.th i{display:block;background-size:100% 100%;background-repeat:no-repeat}
.cp.pl{padding:5px 11px;color:var(--mut)}
.bd{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.bd span{background:var(--c2);border-radius:10px;padding:4px 10px;font-size:13px}
.bd .pur{background:#5b1a72;color:#f6dcff}.bd .gift{background:#d62f1b;color:#fff}.bd .cash{background:#e8d8b4;color:#3b2a14}
.act{display:flex;gap:8px;margin-top:12px}
.b{border-radius:14px;padding:14px;min-height:54px;font-size:18px}
.main{flex:1;background:var(--stc);color:#1b1006}.st-cook .main{color:#fff}.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 14px 0}.sum div{position:relative;border-radius:16px;padding:8px 10px;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--stc)}.sum b{font:400 34px/1 'Alfa Slab One',Georgia,serif;display:block}.sum small{display:block;white-space:nowrap;color:var(--mut);font-weight:800;font-size:12px}.sum i{position:absolute;right:8px;top:6px;font-style:normal;font-size:18px}.dn{padding:8px 16px 2px;color:var(--mut);font-size:13px}
.sec{background:var(--c2);color:var(--mut);width:54px}
.agg{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:10px;margin-bottom:12px}
.agg .chs{margin-top:6px}
.empty{color:var(--mut);text-align:center;padding:26px 10px;border:2px dashed var(--line);border-radius:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#fff3dc;color:#2a1a05;border-radius:16px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;z-index:40;max-width:92vw;box-shadow:0 8px 24px #000a}
.toast button{background:#2a1a05;color:#fff3dc;border-radius:10px;padding:9px 12px}
.bk{border-top:2px dashed var(--line);margin-top:10px;padding-top:2px}.bk-t{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--amb);margin-top:8px}.qty{font:400 18px 'Alfa Slab One',Georgia,serif;color:var(--amb);margin-left:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body>
<header class="hd"><div class="br"><b>🍔 Cocina</b><small>La Hamburguesería</small></div><div class="clk" id="clk"></div>
<div class="tools"><button id="add">＋ Pedido</button><button id="sim" aria-pressed="false">▶ Simular</button><button id="snd" aria-pressed="false" aria-label="Sonido">🔕</button></div></header>
<div class="sum" id="sum"></div><p class="dn" id="dn"></p>
<nav class="tabs" id="tabs"><button class="t-pend on" data-tab="pend">Pendientes<em id="tb-pend">0</em></button><button class="t-cook" data-tab="cook">Cocinando<em id="tb-cook">0</em></button><button class="t-ready" data-tab="ready">Listos<em id="tb-ready">0</em></button></nav>
<main class="cols">
 <section class="col on" id="c-pend"><div class="ch">Pedidos pendientes<span id="n-pend"></span></div><div id="agg-pend"></div><div id="l-pend"></div></section>
 <section class="col" id="c-cook"><div class="ch">Pedidos cocinando<span id="n-cook"></span></div><div id="agg-cook"></div><div id="l-cook"></div></section>
 <section class="col" id="c-ready"><div class="ch">Listos para entregar<span id="n-ready"></span></div><div id="l-ready"></div></section>
</main>
<div class="toast" id="toast" hidden><span id="tmsg"></span><button id="undo">Deshacer</button></div>

const $=q=>document.querySelector(q);
const css=document.createElement('style');css.textContent=Object.entries(IM).map(([k,v])=>`.i-${k}{background-image:url(${v})}`).join('');document.head.appendChild(css);
const NM={queso:['Queso','mozz',135],lechuga:['Lechuga','lettuce',125],huevo:['Huevo frito','huevo',120],salchicha:['Salchicha','salchicha',150],papas:['Papas al hilo','papas',150],tartara:['Tártara','tartara',185],ketchup:['Ketchup','ketchup',185],mostaza:['Mostaza','mostaza',185],mayo:['Mayonesa','mayo',185],aji:['Ají','aji',185]};
const EX=['queso','lechuga','huevo','salchicha','papas'],CR=['tartara','ketchup','mostaza','mayo','aji'];
const LAYS=[['bot',0,.55,0],['patty',40,.5,0],['mozz',22,.5,'queso'],['huevo',20,.5,'huevo'],['salchicha',28,.5,'salchicha'],['lettuce',26,.4,'lechuga'],['papas',30,.4,'papas'],['ketchup',9,.5,'ketchup'],['mostaza',9,.5,'mostaza'],['mayo',9,.5,'mayo'],['tartara',9,.5,'tartara'],['aji',9,.5,'aji'],['top',24,.3,0]];
const UW=460,UH=520,PAD=22;
const thumb=k=>{const [,im,z]=NM[k],[w,h]=DIM[im];return `<span class="th"><i class="i-${im}" style="width:${z}%;aspect-ratio:${w}/${h}"></i></span>`};
function stack(it){let Y=null,h2='';LAYS.forEach(([im,t,cf,key],i)=>{if(key&&!it[key])return;const [w,h]=DIM[im],c=h*cf,y=Y===null?c:Y+t;Y=y;
 h2+=`<i class="i-${im}" style="left:${(UW-w)/2/UW*100}%;width:${w/UW*100}%;aspect-ratio:${w}/${h};bottom:${(y-c+PAD)/UH*100}%;z-index:${i+1}"></i>`});return `<div class="stk">${h2}</div>`}
const chips=(L,it)=>L.filter(k=>it[k]).map(k=>`<span class="cp">${thumb(k)}${NM[k][0]}</span>`).join('');
const now=()=>Date.now(),min=m=>m*6e4,esc=x=>String(x).replace(/[<>&"]/g,'');
let O=[],nextN=50,doneN=8,tab='pend',undoFn=null,tT;
const mk=ks=>Object.fromEntries(ks.map(k=>[k,1]));
const seed=(n,name,st,ago,keys)=>O.push({n,name,st,ts:now()-min(ago),bs:(Array.isArray(keys[0])?keys:[keys]).map(mk)});
const LBL={pend:'👨‍🍳 Aceptar y cocinar',cook:'🔔 Pedido listo',ready:'🤝 Pedido entregado'},BACK={cook:'pend',ready:'cook'};
const SUB=(s,i)=>s=='pend'?(i==1?'⏭ Siguiente en la fila':`Turno ${i} en la fila`):s=='cook'?'🔥 Cocinando':'✅ Listo para entregar';
const nb=L=>L.reduce((a,o)=>a+o.bs.length,0);
function burger(it,i,n){const ex=chips(EX,it),cr=chips(CR,it);
 return `<div class="${i?'bk':''}">${n>1?`<div class="bk-t">Hamburguesa ${i+1} de ${n}</div>`:''}<div class="body">${stack(it)}<div class="ing"><div><div class="gl">Base</div><div class="chs"><span class="cp pl">Pan + carne</span></div></div>${ex?`<div><div class="gl">Extras</div><div class="chs">${ex}</div></div>`:''}<div><div class="gl">Cremas</div><div class="chs">${cr||'<span class="cp pl">Sin cremas</span>'}</div></div></div></div></div>`}
function card(o,i){const id=o.id||o.n;
 return `<article class="o st-${o.st}${o.fresh?' new':''}"><div class="oh"><div class="num">#${o.n}<span class="qty">(${o.bs.length})</span></div><div class="who"><b>${esc(o.name)}</b><small>${SUB(o.st,i)}</small></div><div class="tm" data-ts="${o.ts}" data-s="${o.st}">00:00</div></div>
 ${o.bs.map((it,j)=>burger(it,j,o.bs.length)).join('')}
 <div class="act"><button class="b main" data-act="next" data-id="${id}">${LBL[o.st]}</button>${BACK[o.st]?`<button class="b sec" data-act="back" data-id="${id}" aria-label="Devolver pedido ${o.n}">↩</button>`:''}</div></article>`}
function agg(L,title){const c={};L.forEach(o=>o.bs.forEach(it=>Object.keys(it).forEach(k=>{if(it[k])c[k]=(c[k]||0)+1})));const ks=EX.filter(k=>c[k]),n=nb(L);
 return L.length?`<div class="agg"><div class="gl">${title} · ${n} ${n==1?'hamburguesa':'hamburguesas'}</div><div class="chs">${ks.map(k=>`<span class="cp">${thumb(k)}${NM[k][0]} ×${c[k]}</span>`).join('')||'<span class="cp pl">Solo pan y carne</span>'}</div></div>`:''}
function render(){const S={pend:[],cook:[],ready:[]};O.forEach(o=>S[o.st]&&S[o.st].push(o));
 for(const s in S){S[s].sort((a,b)=>a.ts-b.ts);
  $('#l-'+s).innerHTML=S[s].length?S[s].map((o,i)=>card(o,i+1)).join(''):`<p class="empty">${{pend:'No hay pedidos en espera 🎉',cook:'La cocina está libre 👌',ready:'Nada por entregar'}[s]}</p>`;
  $('#n-'+s).textContent=$('#tb-'+s).textContent=S[s].length}
 $('#agg-pend').innerHTML=agg(S.pend,'Lo que viene');$('#agg-cook').innerHTML=agg(S.cook,'Preparando ahora');
 $('#sum').innerHTML=`<div class="t-pend"><i>⏳</i><b>${S.pend.length}</b><small>En espera</small><small>${nb(S.pend)} 🍔</small></div><div class="t-cook"><i>🔥</i><b>${S.cook.length}</b><small>Cocinando</small><small>${nb(S.cook)} 🍔</small></div><div class="t-ready"><i>✅</i><b>${S.ready.length}</b><small>Por entregar</small><small>${nb(S.ready)} 🍔</small></div>`;

function tick(){
 $('#clk').textContent=new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false});

  e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');e.className='tm'+(m>=L[1]?' bad':m>=L[0]?' warn':'')})}

const save=(o,st)=>{if(DB.ok&&o.id)DB.setOrder(o.id,{st}).catch(e=>{console.error(e);toast('No se pudo guardar el cambio')})};
document.addEventListener('click',e=>{

 else{O=O.filter(x=>x!=o);doneN++;save(o,'done');toast(`#${o.n} entregado`,()=>{O.push(snap);doneN--;save(snap,snap.st);render()})}
 render()});

let ac;const beep=()=>{if($('#snd').getAttribute('aria-pressed')!='true')return;try{ac=ac||new AudioContext();[660,880].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*.16);o.stop(ac.currentTime+i*.16+.14)})}catch(x){}};
$('#snd').onclick=e=>{const b=e.currentTarget,on=b.getAttribute('aria-pressed')!='true';b.setAttribute('aria-pressed',on);b.textContent=on?'🔔':'🔕';beep()};
const toLocal=r=>({id:r.id,n:r.n,name:r.name,st:r.st,ts:Date.parse(r.st_at),bs:r.burgers||[]});
function upsert(r){const ex=O.find(x=>x.id==r.id);
 if(!['pend','cook','ready'].includes(r.st)){if(ex){O=O.filter(x=>x!=ex);if(r.st=='done')doneN++;render()}return}
 const o=toLocal(r);
 if(!ex){o.fresh=1;O.push(o);if(r.st=='pend'){beep();toast(`Llegó el pedido #${r.n} de ${r.name}`)}}
 else{const was=ex.st;Object.assign(ex,o);if(was!=o.st)ex.fresh=1}
 render()}
const NAMES=['Valeria','Jorge','Mía','Renzo','Lucía','Andrés','Camila','Bruno','Sofía','Omar'];
function newOrder(){const bs=Array.from({length:1+Math.floor(Math.random()*3)},()=>{const it={};[...EX,...CR].forEach(k=>{if(Math.random()<.38)it[k]=1});return it});
 O.push({n:nextN++,name:NAMES[Math.floor(Math.random()*NAMES.length)],st:'pend',ts:now(),bs,fresh:1});
 render();beep();toast(`Llegó el pedido #${nextN-1} desde caja`)}
$('#add').onclick=newOrder;
let sm;$('#sim').onclick=e=>{const b=e.currentTarget,on=b.getAttribute('aria-pressed')!='true';b.setAttribute('aria-pressed',on);clearInterval(sm);if(on){newOrder();sm=setInterval(()=>{if(O.length<24)newOrder()},9000)}};
if(DB.ok){doneN=0;$('#add').hidden=true;$('#sim').hidden=true;
 DB.orders(['pend','cook','ready']).then(rs=>{O=rs.map(toLocal);render()}).catch(e=>{console.error(e);toast('No se pudo conectar con la base de datos')});

 DB.watch(upsert)}
else{document.querySelector('.br small').textContent='La Hamburguesería · modo demo';
 seed(38,'Elena','cook',7,['queso','huevo','tartara']);seed(39,'Iván','cook',5,['salchicha','papas','ketchup','aji']);seed(40,'Mara','cook',4,['queso','lechuga','mayo']);

 seed(46,'Ana','pend',4,['queso','lechuga','ketchup']);seed(47,'Pedro','pend',3,['queso','papas','mostaza']);seed(48,'Sara','pend',2,['huevo','papas','aji']);
 seed(36,'Noa','ready',1,['queso','tartara']);seed(37,'Leo','ready',2,['lechuga','ketchup'])}
render();setInterval(tick,1000);
